<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<title>RSL - Register</title>
<style>
:root {
    --primary: linear-gradient(135deg, #6366f1, #8b5cf6);
    --primary-hover: linear-gradient(135deg, #4f46e5, #7c3aed);
    --card-bg: rgba(15, 23, 42, 0.72);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border: rgba(148, 163, 184, 0.25);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
body {
    min-height:100vh; display:flex; justify-content:center; align-items:center;
    padding:20px; color:var(--text-main); background:#020617; overflow-x:hidden; position:relative;
}
.space-bg {
    position:fixed; inset:0; z-index:0;
    background:radial-gradient(ellipse at bottom,#1e1b4b 0%,#0f172a 40%,#020617 100%);
    overflow:hidden;
}
.stars,.stars2,.stars3 { position:absolute; inset:0; background-repeat:repeat; pointer-events:none; }
.stars {
    background-image:
        radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 40px 70px,rgba(255,255,255,0.9),transparent),
        radial-gradient(1px 1px at 90px 40px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 160px 120px,rgba(255,255,255,0.8),transparent),
        radial-gradient(1px 1px at 230px 80px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 300px 150px,rgba(255,255,255,0.9),transparent),
        radial-gradient(1px 1px at 380px 60px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 450px 180px,#fff,transparent);
    background-size:500px 200px; animation:drift 120s linear infinite; opacity:0.9;
}
.stars2 {
    background-image:
        radial-gradient(1px 1px at 50px 50px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 120px 100px,rgba(255,255,255,0.7),transparent),
        radial-gradient(1px 1px at 200px 20px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 280px 140px,#fff,transparent),
        radial-gradient(1px 1px at 350px 90px,rgba(255,255,255,0.8),transparent);
    background-size:400px 180px; animation:drift 80s linear infinite reverse; opacity:0.6;
}
.stars3 {
    background-image:
        radial-gradient(1.5px 1.5px at 70px 20px,#a5b4fc,transparent),
        radial-gradient(1px 1px at 150px 160px,#c4b5fd,transparent),
        radial-gradient(1.5px 1.5px at 250px 70px,#fff,transparent),
        radial-gradient(1px 1px at 320px 130px,#a5b4fc,transparent);
    background-size:350px 200px; animation:drift 150s linear infinite; opacity:0.5;
}
@keyframes drift { from{transform:translateY(0)} to{transform:translateY(-200px)} }
.galaxy {
    position:absolute; width:600px; height:600px; border-radius:50%;
    background:radial-gradient(circle,rgba(139,92,246,0.15) 0%,rgba(99,102,241,0.08) 40%,transparent 70%);
    top:-150px; right:-100px; filter:blur(40px); animation:pulse-galaxy 12s ease-in-out infinite alternate;
}
.galaxy2 {
    position:absolute; width:400px; height:400px; border-radius:50%;
    background:radial-gradient(circle,rgba(56,189,248,0.1) 0%,transparent 70%);
    bottom:-80px; left:-80px; filter:blur(30px); animation:pulse-galaxy 15s ease-in-out infinite alternate-reverse;
}
@keyframes pulse-galaxy { from{opacity:0.6;transform:scale(1)} to{opacity:1;transform:scale(1.1)} }
.moon {
    position:absolute; width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f8fafc,#cbd5e1 50%,#94a3b8);
    top:12%; right:12%;
    box-shadow:0 0 40px rgba(248,250,252,0.3),inset -12px -8px 20px rgba(15,23,42,0.3);
    animation:moon-float 20s ease-in-out infinite; z-index:1;
}
.moon::before { content:""; position:absolute; width:18px; height:18px; border-radius:50%; background:rgba(100,116,139,0.4); top:22px; left:28px; }
.moon::after { content:""; position:absolute; width:10px; height:10px; border-radius:50%; background:rgba(100,116,139,0.35); top:45px; left:50px; }
@keyframes moon-float { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-15px) rotate(3deg)} }
.shooting-star {
    position:absolute; width:80px; height:2px; background:linear-gradient(90deg,#fff,transparent);
    border-radius:50%; top:25%; left:-100px; opacity:0; animation:shoot 8s linear infinite; animation-delay:3s;
}
@keyframes shoot {
    0%{transform:translateX(0) translateY(0);opacity:0} 5%{opacity:1}
    20%{transform:translateX(100vw) translateY(80px);opacity:0} 100%{opacity:0}
}
#authPage { width:100%; display:flex; justify-content:center; align-items:center; position:relative; z-index:10; }
.login-container {
    width:100%; max-width:400px; background:var(--card-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-radius:24px; padding:36px 30px;
    box-shadow:0 25px 50px -12px rgba(0,0,0,0.5),0 0 0 1px rgba(148,163,184,0.12);
    text-align:center; border:1px solid var(--border);
}
.logo-box {
    background:var(--primary); width:64px; height:64px; border-radius:60px; margin:0 auto 18px;
    display:flex; justify-content:center; align-items:center;
    box-shadow:0 10px 25px -5px rgba(99,102,241,0.45); color:white; font-size:22px; font-weight:800;
}
h2 { font-size:24px; font-weight:700; margin-bottom:6px; color:#f8fafc; }
.subtitle { color:var(--text-muted); font-size:14px; margin-bottom:28px; }
.input-group {
    background:rgba(30,41,59,0.7); border-radius:14px; padding:14px 16px; display:flex; align-items:center;
    border:1px solid var(--border); transition:all 0.2s ease; margin-bottom:14px;
}
.input-group:focus-within {
    border-color:#818cf8; background:rgba(30,41,59,0.9); box-shadow:0 0 0 4px rgba(99,102,241,0.2);
}
.input-group input {
    border:none; outline:none; width:100%; font-size:15px; font-weight:500; background:transparent; color:#f1f5f9;
}
.input-group input::placeholder { color:#64748b; }
.eye-icon { width:20px; height:20px; cursor:pointer; opacity:0.5; filter:invert(1); }
.terms-box { display:flex; align-items:flex-start; gap:10px; margin-bottom:22px; text-align:left; }
.terms-box input { margin-top:3px; accent-color:#818cf8; width:16px; height:16px; }
.terms-text { font-size:13px; color:var(--text-muted); line-height:1.5; }
.terms-text a { color:#a5b4fc; font-weight:600; text-decoration:none; }
.btnlogin {
    width:100%; background:var(--primary); border:none; color:#fff; padding:15px; border-radius:14px;
    font-size:16px; font-weight:600; box-shadow:0 4px 15px -3px rgba(99,102,241,0.4); cursor:pointer; transition:all 0.2s;
}
.btnlogin:hover { background:var(--primary-hover); transform:translateY(-1px); box-shadow:0 6px 20px -3px rgba(99,102,241,0.5); }
.btnlogin:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
.divider { display:flex; align-items:center; margin:22px 0; color:var(--text-muted); font-size:13px; }
.divider::before,.divider::after { content:""; flex:1; height:1px; background:var(--border); }
.divider span { padding:0 14px; }
.btn-google {
    width:100%; background:rgba(30,41,59,0.8); border:1px solid var(--border); color:#e2e8f0;
    padding:14px; border-radius:14px; font-size:15px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px; transition:all 0.2s;
}
.btn-google:hover { background:rgba(51,65,85,0.9); border-color:rgba(148,163,184,0.4); }
.btn-google img { width:20px; height:20px; }
.btn-google:disabled { opacity:0.6; cursor:not-allowed; }
.switch-btn { margin-top:22px; color:#a5b4fc; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
.switch-btn:hover { color:#c7d2fe; }
.custom-popup {
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-30px);
    background:rgba(15,23,42,0.95); width:90%; max-width:360px; border-radius:16px; padding:16px;
    display:flex; align-items:center; gap:12px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.4);
    z-index:99999; opacity:0; visibility:hidden; transition:0.3s ease; border:1px solid var(--border); backdrop-filter:blur(12px);
}
.custom-popup.show { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
.popup-icon {
    width:36px; height:36px; border-radius:50%; background:#16a34a; color:#fff;
    display:flex; justify-content:center; align-items:center; font-size:18px; font-weight:bold; flex-shrink:0;
}
.popup-text { flex:1; text-align:left; }
.popup-title { font-size:14px; font-weight:700; color:#f1f5f9; }
.popup-message { font-size:12px; color:#94a3b8; }
.popup-close { cursor:pointer; font-size:18px; color:#94a3b8; }
</style>
</head>
<body>
<div class="space-bg">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
    <div class="galaxy"></div>
    <div class="galaxy2"></div>
    <div class="moon"></div>
    <div class="shooting-star"></div>
</div>

<div class="custom-popup" id="popup">
    <div class="popup-icon" id="popupIcon">✓</div>
    <div class="popup-text">
        <div class="popup-title" id="popupTitle">Success</div>
        <div class="popup-message" id="popupMessage">Action completed</div>
    </div>
    <div class="popup-close" onclick="closePopup()">×</div>
</div>

<div id="authPage">
<div class="login-container">
    <div class="logo-box">RSL</div>
    <h2>Create Account</h2>
    <p class="subtitle">Sign up with Email or Google</p>

    <form id="mainForm">
        <div class="input-group">
            <input type="email" id="email" placeholder="Enter Email Address" required autocomplete="email">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Create Password (min 6 chars)" required autocomplete="new-password">
            <img src="https://cdn-icons-png.flaticon.com/512/709/709612.png" class="eye-icon" onclick="showPassword()" alt="toggle">
        </div>
        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password">
        </div>
        <div class="terms-box">
            <input type="checkbox" id="termsCheck">
            <div class="terms-text">I agree to the <a href="#" target="_blank">Terms & Conditions</a></div>
        </div>
        <button class="btnlogin" type="submit" id="submitBtn">Create Account</button>
    </form>

    <div class="divider"><span>OR</span></div>

   <!-- <button type="button" class="btn-google" id="googleBtn" onclick="signUpWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Continue with Google
    </button>-->

    <a href="login.html" class="switch-btn">Already have an account? Sign In</a>
</div>
</div>

<script>
const PROXY_URL = "https://asdfgh.rakamare248.workers.dev";
let popupTimer;

function showPopup(type, title, message) {
    clearTimeout(popupTimer);
    const popup = document.getElementById("popup");
    const icon = document.getElementById("popupIcon");
    document.getElementById("popupTitle").innerText = title;
    document.getElementById("popupMessage").innerText = message;
    if (type === "success") {
        icon.innerHTML = "✓";
        icon.style.background = "#16a34a";
    } else {
        icon.innerHTML = "!";
        icon.style.background = "#dc2626";
    }
    popup.classList.add("show");
    popupTimer = setTimeout(() => popup.classList.remove("show"), 3500);
}
function closePopup() { document.getElementById("popup").classList.remove("show"); }
function showPassword() {
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

document.getElementById("mainForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();
    const termsAccepted = document.getElementById("termsCheck").checked;
    const submitBtn = document.getElementById("submitBtn");

    if (!email || !password || !confirmPassword) {
        showPopup("error", "Required", "Please fill in all fields");
        return;
    }
    if (password.length < 6) {
        showPopup("error", "Weak Password", "Password must be at least 6 characters");
        return;
    }
    if (password !== confirmPassword) {
        showPopup("error", "Password Mismatch", "Passwords do not match");
        return;
    }
    if (!termsAccepted) {
        showPopup("error", "Terms Required", "Please accept Terms & Conditions");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "Creating Account...";

    try {
        const res = await fetch(PROXY_URL + "/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
            throw new Error(data.error || data.message || "Registration failed");
        }

        if (data.token) localStorage.setItem("token", data.token);
        if (data.refreshToken) localStorage.setItem("refreshToken", data.refreshToken);
        if (data.email) localStorage.setItem("email", data.email);
        else localStorage.setItem("email", email);
        if (data.userId) localStorage.setItem("userId", data.userId);

        showPopup("success", "Account Created", "Welcome! Redirecting...");
        setTimeout(() => location.href = "dashboard.html", 1200);
    } catch (error) {
        showPopup("error", "Register Failed", error.message || "Something went wrong");
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Create Account";
    }
});

function signUpWithGoogle() {
    if (!document.getElementById("termsCheck").checked) {
        showPopup("error", "Terms Required", "Please accept Terms & Conditions");
        return;
    }
    window.location.href = PROXY_URL + "/auth/google";
}
</script>
</body>
</html>
